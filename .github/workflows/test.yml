name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # The contract tests skip here: no NEIGHBOR_BASE_URL is set, and there
      # is no neighbouring team's sandbox for CI to reach.
      - name: Test
        run: python -m pytest --cov=. --cov-report=term
